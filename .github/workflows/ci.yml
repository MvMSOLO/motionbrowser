name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Generate the missing Three.js declaration dependency lock
        run: npm install --package-lock-only --ignore-scripts --save-dev @types/three@0.186.0

      - name: Save generated dependency manifests
        uses: actions/upload-artifact@v4
        with:
          name: three-types-lock
          path: |
            package.json
            package-lock.json
          if-no-files-found: error

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build
