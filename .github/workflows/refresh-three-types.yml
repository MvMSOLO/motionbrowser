name: Refresh Three.js typings lock

on:
  push:
    branches:
      - maintenance/stability-ci-docs

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate lockfile entries
        run: npm install --package-lock-only --ignore-scripts --save-dev @types/three@0.186.0

      - name: Commit dependency manifests
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "build: add Three.js type declarations"
            git push
          fi
