name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Generate the missing Three.js declaration dependency lock
        run: npm install --package-lock-only --ignore-scripts --save-dev @types/three@0.186.0

      - name: Save generated dependency manifests
        uses: actions/upload-artifact@v4
        with:
          name: three-types-lock
          path: |
            package.json
            package-lock.json
          if-no-files-found: error

      - name: Commit generated Three.js typings lock
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "build: add Three.js type declarations"
            git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build
